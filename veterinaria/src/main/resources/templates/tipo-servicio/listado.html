<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tipos de servicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

    <header class="bg-success text-white text-center p-4">
        <h1>Clínica Veterinaria</h1>
    </header>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">Inicio</a>
            <a class="nav-link text-white" th:href="@{/servicio/listado}">
                Servicios
            </a>
            <a class="nav-link text-white" th:href="@{/cita/listado}">
                Citas
            </a>
        </div>
    </nav>

    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Tipos de servicio</h2>
            <a class="btn btn-success" th:href="@{/tipo-servicio/nuevo}">
                Agregar tipo
            </a>
        </div>

        <div th:if="${mensaje}" class="alert alert-success"
             th:text="${mensaje}"></div>

        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="tipo : ${tiposServicio}">
                    <td th:text="${tipo.id}"></td>
                    <td th:text="${tipo.nombre}"></td>
                    <td th:text="${tipo.descripcion}"></td>
                    <td>
                        <a class="btn btn-warning btn-sm"
                           th:href="@{/tipo-servicio/editar/{id}(id=${tipo.id})}">
                            Editar
                        </a>
                        <button class="btn btn-danger btn-sm"
                                data-bs-toggle="modal"
                                data-bs-target="#modalEliminar"
                                th:attr="data-id=${tipo.id},data-nombre=${tipo.nombre}">
                            Eliminar
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>

        <a class="btn btn-secondary" th:href="@{/}">
            Volver al inicio
        </a>
    </main>

    <div class="modal fade" id="modalEliminar" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirmar eliminación</h5>
                    <button type="button" class="btn-close"
                            data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    ¿Deseas eliminar el tipo de servicio
                    <strong id="nombreTipo"></strong>?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary"
                            data-bs-dismiss="modal">Cancelar</button>
                    <form id="formEliminar" method="post">
                        <button type="submit" class="btn btn-danger">
                            Eliminar
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center p-3">
        Clínica Veterinaria - Cuidado y bienestar animal
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const modalEliminar = document.getElementById('modalEliminar');

        modalEliminar.addEventListener('show.bs.modal', function (event) {
            const boton = event.relatedTarget;
            const id = boton.getAttribute('data-id');
            const nombre = boton.getAttribute('data-nombre');

            document.getElementById('nombreTipo').textContent = nombre;
            document.getElementById('formEliminar').action =
                '/tipo-servicio/eliminar/' + id;
        });
    </script>

</body>
</html>
